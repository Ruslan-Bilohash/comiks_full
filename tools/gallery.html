<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Галерея кадрів (перевірка малюнків)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Pangolin&family=Rubik:wght@700;900&display=swap">
<style>
  body { margin: 0; background: #fff8ea; font-family: Rubik, sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 400px); gap: 0; }
  .grid svg { width: 400px; height: 300px; display: block; outline: 2px solid #141414; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script src="../data/index.js"></script>
<script>
  // Службова сторінка: tools/gallery.html?c=p90 — усі кадри коміксу (для перевірки малюнків)
  const reg = window.KOMIKS_DATA;
  const files = reg.shared.filter(f => !f.endsWith('audio.js')).concat(reg.comics.map(c => c.file));
  (function load(i) {
    if (i >= files.length) return render();
    const s = document.createElement('script'); s.src = '../' + files[i]; s.onload = s.onerror = () => load(i + 1); document.body.appendChild(s);
  })(0);
  function render() {
    const id = new URLSearchParams(location.search).get('c') || COMICS[0].id;
    const c = COMICS.find(x => x.id === id);
    const g = document.getElementById('g');
    c.panels.forEach((p, i) => { g.insertAdjacentHTML('beforeend', KomiksArt.panel(c, i, { lang: 'no', tr: 'uk', chars: CHARACTERS })); });
  }
</script>
</body>
</html>
