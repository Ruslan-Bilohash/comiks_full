<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>icon</title>
<style>
  html, body { margin: 0; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: grid; place-items: center; background: #ffd23f radial-gradient(rgba(20,20,20,.12) 1.2vmin, transparent 1.4vmin) 0 0 / 7vmin 7vmin; }
  .b { position: relative; width: 74vmin; height: 58vmin; background: #fff; border: 5vmin solid #141414; border-radius: 30vmin; display: grid; place-items: center; box-shadow: 3vmin 3vmin 0 #141414; margin-bottom: 8vmin; }
  .b::after { content: ''; position: absolute; left: 12vmin; bottom: -17vmin; border-left: 9vmin solid transparent; border-right: 9vmin solid transparent; border-top: 16vmin solid #141414; transform: rotate(20deg); }
  .b span { font: 900 26vmin/1 'Arial Black', Rubik, sans-serif; color: #ee4035; letter-spacing: -1vmin; }
</style>
</head>
<body><div class="b"><span>NO</span></div></body>
</html>
