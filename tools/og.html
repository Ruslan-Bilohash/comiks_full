<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&family=Pangolin&family=Rubik:wght@700;900&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: Nunito, 'Segoe UI', sans-serif; color: #141414;
    background: #ffd23f radial-gradient(rgba(20,20,20,.1) 2px, transparent 2.4px) 0 0 / 18px 18px;
  }
  .rays { position: absolute; inset: -300px; background: repeating-conic-gradient(from 0deg at 72% 55%, rgba(255,255,255,.28) 0 9deg, transparent 9deg 18deg); }
  .logo { position: absolute; left: 56px; top: 44px; display: flex; align-items: center; gap: 14px; }
  .logo span { display: grid; place-items: center; width: 74px; height: 74px; font-size: 42px; background: #fff; border: 5px solid #141414; border-radius: 50%; box-shadow: 5px 5px 0 #141414; transform: rotate(-8deg); }
  .logo b { font: 900 52px/1 Rubik, 'Arial Black', sans-serif; }
  .logo i { font: 400 58px/1 Bangers, Impact, sans-serif; font-style: normal; color: #ee4035; -webkit-text-stroke: 2px #141414; }
  h1 { position: absolute; left: 56px; top: 150px; width: 640px; margin: 0; font: 900 70px/1.02 Rubik, 'Arial Black', sans-serif; letter-spacing: -2px; }
  h1 em { font-style: normal; display: inline-block; margin-top: 10px; background: #ee4035; color: #fff; padding: 2px 16px 8px; border: 5px solid #141414; box-shadow: 7px 7px 0 #141414; transform: rotate(-2deg); }
  .chips { position: absolute; left: 56px; bottom: 50px; display: flex; flex-wrap: wrap; gap: 12px; width: 660px; }
  .chip { font: 900 25px Nunito, sans-serif; background: #fff; border: 4px solid #141414; border-radius: 999px; padding: 7px 18px; box-shadow: 4px 4px 0 #141414; }
  .panel { position: absolute; right: 56px; top: 60px; width: 400px; height: 500px; background: #ffb3cf; border: 6px solid #141414; border-radius: 10px; box-shadow: 10px 10px 0 #141414; overflow: hidden; transform: rotate(2deg); }
  .panel .dots { position: absolute; inset: 0; background: radial-gradient(rgba(0,0,0,.12) 2px, transparent 2.4px) 0 0 / 14px 14px; }
  .bubble { position: absolute; left: 22px; right: 22px; background: #fff; border: 5px solid #141414; border-radius: 26px; padding: 12px 18px; font: 400 33px/1.15 Pangolin, 'Comic Sans MS', cursive; }
  .b1 { top: 24px; } .b2 { top: 172px; background: #e3f0ff; font-size: 29px; }
  .b2 small { display: block; font: 900 16px Rubik, sans-serif; color: #2e86de; }
  .b1 small { display: block; font: 900 16px Rubik, sans-serif; color: #ee4035; }
  .emo { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; white-space: nowrap; font-size: 104px; line-height: 1; font-family: 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
  .boom { position: absolute; right: 400px; top: 350px; width: 190px; height: 190px; display: grid; place-items: center; background: #fff; clip-path: polygon(50% 0,61% 30%,95% 20%,72% 48%,100% 70%,64% 68%,58% 100%,43% 72%,8% 88%,28% 57%,0 30%,36% 34%); }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="logo"><span>💬</span><b>Komiks</b><i>·Lab</i></div>
  <h1>Learn Norwegian<br><em>with comics!</em></h1>
  <div class="chips">
    <span class="chip">🔊 real Norwegian voices</span>
    <span class="chip">👆 every word translated</span>
    <span class="chip">🧩 tests &amp; games</span>
    <span class="chip">📚 A1–B2 levels</span>
  </div>
  <div class="panel">
    <div class="dots"></div>
    <div class="bubble b1"><small>NO</small>Hvor kommer du fra?</div>
    <div class="bubble b2"><small>EN</small>Where are you from?</div>
    <div class="emo">🧔🏻✈️🏔️</div>
  </div>
</body>
</html>
