# Комікс·Lab — збірка iOS без власного Mac.
#
# Codemagic дає справжні Mac mini в оренду по хвилинах і вміє сам випускати
# сертифікати через ключ App Store Connect API. Тобто весь шлях — від коду до
# TestFlight — проходить у браузері: Mac не потрібен ні для збірки, ні навіть
# для створення сертифіката.
#
# Що зробити один раз перед першим запуском:
#   1. App Store Connect → Users and Access → Integrations → App Store Connect API
#      → створити ключ із роллю App Manager, завантажити .p8.
#   2. Codemagic → Teams → Integrations → Apple Developer Portal → додати цей ключ
#      (issuer id, key id, файл .p8). Назвати інтеграцію `appstore`.
#   3. Codemagic → Environment variables → група `appstore`:
#        APP_STORE_APP_ID   — числовий id застосунку з App Store Connect
#      (додається після того, як застосунок там створено).
#
# Далі кожна збірка — одна кнопка.

workflows:
  ios-offline:
    name: Komiks·Lab iOS (офлайн-збірка)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: appstore
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.bilohash.komikslab"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Завантажити озвучення
        script: |
          # Теки audio/ у репозиторії немає: це 10 тисяч mp3 на 200 МБ, які
          # відтворюються командою gen_audio.py. Складальна машина бачить лише
          # репозиторій, тож без цього кроку вийшов би «офлайн-застосунок», у
          # якому нічого не звучить. Архів робиться командою:
          #     node tools/pack-audio.js
          curl -fsSL -o audio-pack.tar.gz https://bilohash.com/comiks/audio-pack.tar.gz
          tar -xzf audio-pack.tar.gz && rm audio-pack.tar.gz
          echo "озвучень: $(ls audio | wc -l)"

      - name: Зібрати сайт і офлайн-вміст
        script: |
          node tools/build.js
          node app/android_offline/build.js
          # В iOS іде саме офлайн-вміст: 89 історій і все озвучення всередині
          # застосунку — це головний аргумент проти правила 4.2 (обгортка
          # навколо сайту) і єдиний, який перевіряльник бачить одразу.
          rm -rf app/www && cp -r app/android_offline/www app/www

      - name: Створити нативний проєкт
        script: |
          cd app
          npm ci || npm install
          npx cap add ios || echo "проєкт уже є — пропускаю"
          npx --yes @capacitor/assets generate --ios
          npx cap sync ios

      - name: Пояснення доступу та версія
        script: |
          node app/tools/ios-plist.js
          cd app/ios/App
          agvtool new-marketing-version 1.1
          agvtool new-version -all "$(($(date +%s) / 60))"
          # Номер збірки має зростати при кожному завантаженні, інакше App Store
          # Connect відхиляє файл ще до перевірки. Хвилини від епохи зростають
          # завжди й не вимагають нічого пам'ятати.

      - name: Підпис
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Зібрати .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/app/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Коли TestFlight пройде добре — поміняти на подання в App Store:
        # submit_to_app_store: true
